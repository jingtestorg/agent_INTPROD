apiVersion: asset.sap/v1
kind: Asset
type: agent

metadata:
  name: greeting-onboarding-agent
  description: An AI agent that greets new employees by name, collects their role, and guides them through a step-by-step onboarding conversation.
  version: 1.0.0

provides:
  apis:
    - name: greeting-onboarding-agent
      kind: a2a
      ordId: customer.build:apiResource:greeting-onboarding-12ace.greeting-onboarding-agent:v1

container:
  buildPath: .
  port: 5000

probes:
  startup:
    path: /.well-known/agent.json
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 18
  liveness:
    path: /.well-known/agent.json
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    path: /.well-known/agent.json
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
